<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1118" id="theme-color">
  <script>
    document.documentElement.classList.add('js');
    try { if (localStorage.getItem('live-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
  {% seo %}
  <link rel="preconnect" href="https://huggingface.co">
  <link rel="stylesheet" href="{{ '/assets/css/live.css' | relative_url }}">
  <script src="{{ '/assets/js/live.js' | relative_url }}" defer></script>
</head>
<body>
  {{ content }}
</body>
</html>
